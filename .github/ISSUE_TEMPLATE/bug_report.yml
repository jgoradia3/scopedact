name: Bug report
description: Report reproducible behavior in the developer preview
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, customer data, or other secrets.
  - type: input
    id: version
    attributes:
      label: ScopedAct and Python versions
      placeholder: scopedact 0.10.0; Python 3.11
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include commands or a small code sample and the observed output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
