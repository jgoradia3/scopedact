name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python tools/check_repository.py
      - run: node tests/test_console_actions.cjs
      - run: python examples/quickstart.py
      - run: scopedact init --project /tmp/scopedact-ci
      - run: scopedact doctor --project /tmp/scopedact-ci
      - run: python -W error::ResourceWarning tools/check_sqlite_resources.py
      - run: scopedact demo --output audit/ci-demo.jsonl
      - run: scopedact lifecycle-demo --database audit/ci-lifecycle.db --output audit/ci-lifecycle.jsonl
      - run: scopedact status --database audit/ci-lifecycle.db
      - run: scopedact workflow-demo --database audit/ci-workflow.db --config config/lifecycle.json --output audit/ci-workflow.jsonl
      - run: scopedact verify-events --database audit/ci-workflow.db
      - run: scopedact connectors
      - run: scopedact --version
      - run: scopedact tour --database audit/ci-tour.db --output audit/ci-tour.jsonl
      - run: SCOPEDACT_AUTHORITY_KEY=ci-only-test-secret scopedact authority-create --config config/lifecycle.json --output audit/ci-authority.json
      - run: SCOPEDACT_AUTHORITY_KEY=ci-only-test-secret scopedact authority-verify --config config/lifecycle.json --bundle audit/ci-authority.json
      - run: SCOPEDACT_ANCHOR_KEY=ci-only-test-secret scopedact anchor-events --database audit/ci-workflow.db --output audit/ci-workflow.anchor.json
      - run: SCOPEDACT_ANCHOR_KEY=ci-only-test-secret scopedact verify-anchor --database audit/ci-workflow.db --anchor audit/ci-workflow.anchor.json
      - run: python -m pip install build
      - run: python -m build

  ticket-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: scopedact-pilot init
      - run: docker compose -f compose.pilot.yaml up --build -d --wait
      - run: scopedact-pilot evaluate --output pilot-results/evaluation.json
      - run: scopedact-pilot evaluate-delegation --output pilot-results/delegation.json
      - run: python pilot/verify_isolation.py
      - run: docker compose -f compose.pilot.yaml restart && docker compose -f compose.pilot.yaml up -d --wait
      - run: scopedact-pilot evaluate --output pilot-results/after-restart.json
      - run: scopedact-pilot evaluate-delegation --output pilot-results/delegation-after-restart.json
      - if: always()
        run: docker compose -f compose.pilot.yaml down

  managed-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Match Linux bind-mount ownership
        run: |
          echo "SCOPEDACT_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "SCOPEDACT_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: scopedact-workspace init
      - run: scopedact-incident seed
      - run: docker compose -f compose.workspace.yaml up --build -d --wait
      - run: docker compose -f compose.workspace.yaml --profile verify run --rm agent-probe
      - run: docker compose -f compose.workspace.yaml --profile verify run --rm child-probe
      - run: scopedact-incident start
      - run: scopedact-incident discover
      - run: scopedact-incident select-runbook --resource doc:authentication-runbook-gateway-2.8.md
      - run: scopedact-incident investigate
      - run: scopedact-incident probe-restricted
      - run: scopedact-workspace demo --reads 101
      - run: docker compose -f compose.workspace.yaml restart gateway
      - run: docker compose -f compose.workspace.yaml up -d --wait
      - run: scopedact-workspace demo --reads 4
      - if: failure()
        run: docker compose -f compose.workspace.yaml logs --no-color
      - if: always()
        run: docker compose -f compose.workspace.yaml down

  live-incident-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Match Linux bind-mount ownership
        run: |
          echo "SCOPEDACT_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "SCOPEDACT_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: scopedact-lab init
      - run: docker compose -p scopedact-live-lab -f compose.lab.yaml up --build -d --wait identity portal operations gateway
      - run: docker compose -p scopedact-live-lab -f compose.lab.yaml run --rm inject-fault
      - run: python tools/evaluate_live_lab.py
      - if: failure()
        run: docker compose -p scopedact-live-lab -f compose.lab.yaml logs --no-color
      - if: always()
        run: docker compose -p scopedact-live-lab -f compose.lab.yaml down
